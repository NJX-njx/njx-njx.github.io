{{- $headers := findRE "<h[1-6].*?>(.|\n])+?</h[1-6]>" .Content -}}
{{- if ge (len $headers) 1 -}}
<div class="toc">
    <div class="toc-title">{{- i18n "toc" | default "Table of Contents" -}}</div>
    <div class="inner">
        {{- replaceRE "id=\"TableOfContents\"" "" .TableOfContents | safeHTML -}}
    </div>
</div>
{{- end -}}
