baseURL: "https://njx-njx.github.io/"
languageCode: "zh-cn"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
title: "Njx'Log"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Njx's Blog
  description: "记录 AI/ML 与工程实践的学习笔记。"
  keywords: [AI, ML, LLM, RAG, Multimodal, MLOps, Engineering]
  author: jiaxing ni
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    favicon: "/kpbl.png"

  label:
    text: "Njx'Log"
    icon: "/kpbl.png"
    iconHeight: 35

  # home-info mode
  homeInfoParams:
    Title: "👋 Welcome to Njx'Log"
    Content: >
        Hi, this is Jiaxing Ni. I share my AI/ML learning notes, experiments, and engineering write-ups here.
        
        Posts started in 2023 and are updated as I learn more.

  images:
    - "/kpbl.png"

  socialIcons:
    - name: twitter
      url: "https://x.com/XS6393865633072"
    - name: github
      url: "https://github.com/NJX-njx"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50
    - identifier: faq
      name: FAQ
      url: /faq/
      weight: 60

outputs:
  home:
    - HTML
    - RSS
    - JSON
