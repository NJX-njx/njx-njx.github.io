baseURL: "https://njx-njx.github.io/"
locale: "zh-cn"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
title: "Njx'Log"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Njx's Blog
  description: "记录 AI/ML 与工程实践的学习笔记。"
  keywords: [AI, ML, LLM, RAG, Multimodal, MLOps, Engineering]
  author: jiaxing ni
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: true

  aiAssistant:
    enabled: true
    endpoint: "https://njx-log-ai-assistant.njx-log.workers.dev/ask"

  assets:
    favicon: "/capybara-right.png"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

  label:
    text: "Njx'Log"
    icon: "/capybara-right.png"
    iconHeight: 35

  # home-info mode
  homeInfoParams:
    Title: "👋 Welcome to Njx'Log"
    Content: >
        Hi, this is Jiaxing Ni. I write about AI/ML, product thinking and building, evals, agentic RL, and the engineering work of turning ideas into systems.
        
        Posts started in 2024 and are updated as I learn more.

  images:
    - "/capybara-right.png"

  socialIcons:
    - name: twitter
      url: "https://x.com/NJX_njx_ai"
    - name: github
      url: "https://github.com/NJX-njx"
    - name: huggingface
      title: Hugging Face
      url: "https://huggingface.co/NJX-njx"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50
    - identifier: faq
      name: FAQ
      url: /faq/
      weight: 60

outputs:
  home:
    - HTML
    - RSS
    - JSON
